name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run; every push to main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starlight
          POSTGRES_PASSWORD: starlight-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      STARLIGHT_TEST_DATABASE_URL: postgres://starlight:starlight-ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: raise the Postgres connection limit for parallel suites
        run: |
          PGPASSWORD=starlight-ci psql -h localhost -U starlight -d postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "${{ job.services.postgres.id }}"
          for i in $(seq 1 60); do pg_isready -h localhost -U starlight && break; sleep 1; done
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: lean check
        run: go run ./tools/leancheck .
      - name: shadow metadata payload movement regression
        run: go test -count=1 -run '^TestUnavailableShadowSnapshotAvoidsWideWindow$' -v ./internal/admission
      - name: matched shadow admission and gateway overhead profiles
        run: STARLIGHT_SHADOW_OVERHEAD=1 go test -p 1 -count=1 -timeout=8m -run '^TestRoutingShadowOverhead$' -v ./internal/admission ./internal/e2e
      - name: matched controlled routing traces
        run: |
          for trace in tools/routing-replay/testdata/*.json; do
            echo "$trace"
            go run ./tools/routing-replay -input "$trace"
          done
      - name: race tests
        run: go test -race -count=1 ./...
      - name: concurrent and held-collector phase-telemetry fixtures
        run: STARLIGHT_PHASE_TELEMETRY_CONCURRENT=1 go test -count=1 -timeout=6m -run '^TestConcurrentPhaseTelemetry' -v ./internal/e2e
      - name: disabled, sampled and full phase-telemetry profiles
        run: STARLIGHT_PHASE_TELEMETRY_OVERHEAD=1 go test -count=1 -timeout=5m -run '^TestPhaseTelemetryOverhead$' -v ./internal/e2e
      - name: 8,000-user load test
        run: STARLIGHT_SCALE=1 go test -count=1 -run TestEightThousandUsers -v ./internal/e2e
      - name: receipt cleanup at 200 expired rows per second
        run: STARLIGHT_ACCOUNTING_CAPACITY=1 go test -count=1 -timeout=2m -run TestAccountingCleanupSustainsTwoHundredExpiredReceiptsASecond -v ./internal/accounting

  drills:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starlight
          POSTGRES_PASSWORD: starlight-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      STARLIGHT_TEST_DATABASE_URL: postgres://starlight:starlight-ci@localhost:5432/postgres?sslmode=disable
      STARLIGHT_DRILL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: Postgres 17 client tools, to match the server
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: kill the controller leader, then restore a backup into a new database
        run: go test -count=1 -run TestHighAvailabilityDrills -v ./internal/e2e
      - name: terminal accounting survives database and fresh-worker restarts
        run: STARLIGHT_POSTGRES_DRILL=1 go test -count=1 -timeout=2m -run '^TestTerminalAccountingSurvivesDatabaseAndWorkerRestart$' -v ./internal/e2e

  engine:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: fetch the TensorFold release engine.json pins
        run: |
          engine=$(scripts/fetch-engine.sh linux-x86_64 "$RUNNER_TEMP/tensorfold")
          echo "STARLIGHT_ENGINE=$engine" >> "$GITHUB_ENV"
      - name: engine contract
        run: go test -count=1 -run 'TestEngineContract|TestPinnedEngineIsOneStarlightRuns' -v ./internal/node/engine

  macos:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: fetch the TensorFold release engine.json pins
        run: |
          engine=$(scripts/fetch-engine.sh macos-arm64 "$RUNNER_TEMP/tensorfold")
          echo "STARLIGHT_ENGINE=$engine" >> "$GITHUB_ENV"
      - name: build with the tray and Keychain storage
        run: go build ./cmd/...
      - name: node agent, engine contract and Connect tests
        run: go test -race -count=1 ./internal/node/... ./internal/connect/... ./internal/mdns/... ./cmd/...

  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    env:
      STARLIGHT_TEST_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: start the runner's Postgres
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          & "$env:PGBIN\psql.exe" --version
          & "$env:PGBIN\pg_isready.exe" -h localhost
      - name: build with the tray and Credential Manager storage
        run: go build ./cmd/...
      - name: node agent and Connect tests
        run: go test -race -count=1 ./internal/node/... ./internal/connect/... ./internal/mdns/... ./cmd/...
      - name: a fleet on Windows, with a fake engine
        run: go test -count=1 -run "TestLocalFleetServesEveryProtocol|TestConcurrencyLimitAndRevocation|TestNodeOnlineControls|TestEnrolWithOnlyWhatStarlightPrints|TestLiveThroughputReachesStarlight|TestStoredResponsesBelongToTheirOwner" ./internal/e2e
      - name: install-windows.ps1, the service and the state directory's ACL
        env:
          STARLIGHT_DRILL: "1"
        run: go test -count=1 -run TestWindowsNodeService -v ./internal/e2e
      - name: Connect's credentials in Credential Manager, and Group Policy
        env:
          TENSORFOLD_CONNECT_PLATFORM_STORE_TEST: "1"
          TENSORFOLD_CONNECT_POLICY_TEST: "1"
        run: go test -count=1 -run "TestPlatformStore|TestTokensLandInCredentialManager|TestShippedPolicyLocksTheServer" -v ./internal/connect/store ./cmd/tensorfold-connect
      - name: the tray starts and stays up
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\tensorfold-connect.exe" ./cmd/tensorfold-connect
          $env:TENSORFOLD_CONNECT_STORE = 'file'
          $tray = Start-Process -PassThru -FilePath "$env:RUNNER_TEMP\tensorfold-connect.exe" -ArgumentList tray `
            -RedirectStandardError "$env:RUNNER_TEMP\tray.err" -RedirectStandardOutput "$env:RUNNER_TEMP\tray.out"
          Start-Sleep -Seconds 8
          Get-Content "$env:RUNNER_TEMP\tray.err", "$env:RUNNER_TEMP\tray.out"
          if ($tray.HasExited) { throw "the tray exited with code $($tray.ExitCode)" }
          Stop-Process -Id $tray.Id

  linux-desktop:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: with no Secret Service, Connect uses its private file
        env:
          TENSORFOLD_CONNECT_EXPECT_STORE: private file
        run: |
          go test -c -o "$RUNNER_TEMP/store.test" ./internal/connect/store
          (cd internal/connect/store && env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR "$RUNNER_TEMP/store.test" -test.run TestOpenChoosesTheExpectedStore -test.v)
          (cd internal/connect/store && dbus-run-session -- "$RUNNER_TEMP/store.test" -test.run TestOpenChoosesTheExpectedStore -test.v)
      - name: install GNOME Keyring and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools xvfb
      - name: under GNOME Keyring, tokens land in the Secret Service
        env:
          TENSORFOLD_CONNECT_PLATFORM_STORE_TEST: "1"
          TENSORFOLD_CONNECT_EXPECT_STORE: Secret Service
        run: |
          cd internal/connect/store
          xvfb-run -a dbus-run-session -- bash -euc '
            eval "$(printf ci-keyring | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            "$RUNNER_TEMP/store.test" -test.run "TestPlatformStore|TestOpenChoosesTheExpectedStore|TestTokensLandInTheSecretService" -test.v
          '
      - name: the tray starts and stays up
        run: |
          go build -o "$RUNNER_TEMP/tensorfold-connect" ./cmd/tensorfold-connect
          status=0
          TENSORFOLD_CONNECT_STORE=file TENSORFOLD_CONNECT_HOME="$RUNNER_TEMP/connect" xvfb-run -a dbus-run-session -- \
            timeout 8 "$RUNNER_TEMP/tensorfold-connect" tray || status=$?
          if [ "$status" != 124 ]; then echo "::error::the tray exited with status $status before the timeout ended it"; exit 1; fi

  cross:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: build
        run: |
          os="${{ matrix.target }}"; arch="${os#*/}"; os="${os%/*}"
          tags=""
          if [ "$os" = darwin ]; then tags=notray; fi
          for cmd in starlight starlight-node tensorfold-connect; do
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -tags "$tags" -o /dev/null "./cmd/$cmd"
          done
      - name: vet
        run: |
          os="${{ matrix.target }}"; arch="${os#*/}"; os="${os%/*}"
          tags=""
          if [ "$os" = darwin ]; then tags=notray; fi
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go vet -tags "$tags" ./...

  deploy-assets:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pinned engine download failure fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_fetch_engine.py' -v
      - name: helm lint and render
        run: |
          helm lint deploy/helm/starlight
          helm template starlight deploy/helm/starlight > /dev/null
          helm template starlight deploy/helm/starlight --set ingress.enabled=true --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true --set networkPolicy.enabled=true > /dev/null
      - name: promtool
        run: |
          check() { docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v3.5.0 check "$@"; }
          check rules /p/rules/starlight.yaml
          check config /p/prometheus.yml
          check config --syntax-only /p/scrape-with-token.example.yaml

  quickstart:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: fetch the TensorFold release engine.json pins
        run: |
          engine=$(scripts/fetch-engine.sh linux-x86_64 "$RUNNER_TEMP/tensorfold")
          echo "STARLIGHT_ENGINE=$engine" >> "$GITHUB_ENV"
      - name: Docker and Compose versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: the README's Compose quick start, as written
        run: scripts/check-quickstart.sh

  image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the Starlight image
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/starlight/Dockerfile --build-arg VERSION="${GITHUB_SHA::12}" --build-arg COMMIT="${GITHUB_SHA::12}" .
      - name: build the node image with the pinned engine
        run: docker buildx build --platform linux/amd64 -f deploy/node/container/Dockerfile .
