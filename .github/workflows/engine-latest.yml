name: Newest TensorFold engine

# Daily: the engine contract against TensorFold's newest release, so a change there shows before engine.json moves.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: fetch TensorFold's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine=$(scripts/fetch-engine.sh linux-x86_64 "$RUNNER_TEMP/tensorfold" latest)
          echo "STARLIGHT_ENGINE=$engine" >> "$GITHUB_ENV"
          "$engine" --version
      - name: engine contract
        run: go test -count=1 -run TestEngineContract -v ./internal/node/engine
